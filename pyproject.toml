[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-platform"
version = "0.1.0"
description = "Incremental DuckDB/Parquet analytical data + ML platform for NYC TLC yellow taxi trips"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32.0", "plotly>=5.20.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "matplotlib>=3.8.0", "jupyter>=1.0.0"]
all = ["nyc-taxi-platform[dashboard,dev]"]

[project.scripts]
taxi = "taxi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taxi = ["marts/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: tests that build or scan real partitions",
    "requires_data: tests that need at least one ingested month",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
